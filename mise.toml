[tools]
go = "1.27.0"
golangci-lint = "2.12.2"

[tasks.bundle]
description = "Build golangci-lint with the local go-linters plugins"
run = "golangci-lint custom"

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks.test-bundle]
description = "Run the compiled golangci-lint bundle integration test"
env = { GOLANGCI_LINT_BINARY = "{{config_root}}/bin/golangci-lint" }
run = "go test -tags=integration -run '^TestBundle$' -count=1 ./..."
