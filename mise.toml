[tools]
go = "1.27.0"
golangci-lint = []
"github:justtrackio/go-linters" = "0.3.0"

[tasks.bundle]
description = "Build the local go-linters bundle with the pinned upstream runner"
run = "mise exec aqua:golangci/golangci-lint@2.13.1 -- golangci-lint custom"

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks.test-bundle]
description = "Run the compiled golangci-lint bundle integration test"
env = { GOLANGCI_LINT_BINARY = "{{config_root}}/bin/golangci-lint" }
run = "go test -tags=integration -run '^TestBundle$' -count=1 ./..."
