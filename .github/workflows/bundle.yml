name: Custom golangci-lint bundle

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: Run Go tests
        run: mise run test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Build custom golangci-lint
        run: mise run bundle
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Smoke-test native bundle
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: scripts/smoke-bundle.sh ./bin/golangci-lint
      - name: Package target
        shell: bash
        env:
          PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="go-linters_${PACKAGE_VERSION}_${GOOS}_${GOARCH}.tar.gz"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/LICENSE \
            --output dist/LICENSE.golangci-lint
          tar -czf "dist/${archive}" \
            -C "$PWD/bin" golangci-lint \
            -C "$PWD/dist" LICENSE.golangci-lint
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release create "$RELEASE_VERSION" \
            --verify-tag \
            --generate-notes \
            ./*.tar.gz \
            SHA256SUMS
